server.port=${SERVER_PORT:8083}
spring.application.name=registration-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/registration_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
course-service.base-url=${COURSE_SERVICE_BASE_URL:http://localhost:8082}
internal.api-key=${INTERNAL_API_KEY:crs-internal-change-me}
jwt.secret=${JWT_SECRET:CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te}
server.error.include-message=always
